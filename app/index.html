<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON VICE — Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-star">&#10022;</span> NEON VICE <span class="brand-sub">cover art maker</span></div>
  <div class="top-actions">
    <label class="size-label">Size
      <select id="size">
        <option value="1920x1080">1920 x 1080 — landscape post</option>
        <option value="1080x1350">1080 x 1350 — portrait post</option>
        <option value="1080x1080">1080 x 1080 — square post</option>
      </select>
    </label>
    <button id="export" class="export-btn" type="button">Export PNG</button>
  </div>
</header>
<main class="stage-wrap">
  <section class="stage">
    <canvas id="cover" width="1920" height="1080" aria-label="Your cover art"></canvas>
    <p id="status" role="status">Drop in your photos — the poster builds itself.</p>
  </section>
  <aside class="panel">
    <div class="group">
      <h2>Photos</h2>
      <div id="thumbs" class="thumbs"></div>
      <div class="row btns">
        <label class="file-btn">Add photos<input id="photo" type="file" accept="image/*" multiple hidden></label>
        <button id="samples" class="ghost-btn" type="button">Reset demo photos</button>
      </div>
      <p class="hint">Photos fill the poster panels in order. Click a panel on the cover, then drag the photo inside it. Click a photo here to put it in the selected panel.</p>
    </div>
    <div class="group">
      <h2>Panel</h2>
      <div id="panelChips" class="chips"></div>
      <p class="sel-name" id="selName">Panel 1</p>
      <label class="ctl">Zoom <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
      <div class="row btns">
        <button id="gradeToggle" class="ghost-btn" type="button">Grade: Sunset</button>
        <button id="backdropBtn" class="ghost-btn" type="button">Backdrop: Dusk Beach</button>
      </div>
    </div>
    <div class="group">
      <h2>Words</h2>
      <label class="ctl-text">Headline <input id="caption" type="text" maxlength="26" value="Neon Shores"></label>
      <label class="ctl-text">Kicker <input id="kicker" type="text" maxlength="42" value="Sunset County &#8226; Est. 1987"></label>
    </div>
    <div class="group">
      <h2>Look</h2>
      <label class="ctl-text">Layout
        <select id="layout">
          <option value="poster">Poster — hero panel</option>
          <option value="focus">Focus — one big cut</option>
          <option value="strip">Strip — hero band</option>
          <option value="grid">Grid — four cuts</option>
        </select>
      </label>
      <label class="ctl">Vice grade <input id="grade" type="range" min="0" max="1" step="0.01" value="0.85"></label>
    </div>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
